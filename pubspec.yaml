name: inkwell_notes
description: "A beautiful, offline-first note-taking app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  drift: ^2.30.0
  flutter:
    sdk: flutter
  flutter_quill: ^11.5.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.2
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.0
  drift_dev: ^2.30.0

flutter:
  uses-material-design: true
